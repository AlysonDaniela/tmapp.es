  <body>
    <div id="root"></div>

    <script>
      (function () {
        let isSyncing = false;
        let lastSent = 0;
        let lastUrl = location.href;

        function getScrollPercent() {
          const doc = document.documentElement;
          const maxScroll = doc.scrollHeight - window.innerHeight;

          if (maxScroll <= 0) return 0;

          return window.scrollY / maxScroll;
        }

        function scrollToPercent(percent, smooth) {
          const doc = document.documentElement;
          const maxScroll = doc.scrollHeight - window.innerHeight;
          const targetY = Math.max(0, Math.min(1, percent)) * maxScroll;

          isSyncing = true;

          window.scrollTo({
            top: targetY,
            behavior: smooth ? "smooth" : "auto"
          });

          setTimeout(function () {
            isSyncing = false;
          }, 150);
        }

        function notifyNavigation() {
          const currentUrl = location.href;

          if (currentUrl === lastUrl) return;

          lastUrl = currentUrl;

          window.parent.postMessage(
            {
              __RMS__: true,
              type: "CHILD_NAVIGATION",
              url: currentUrl
            },
            "*"
          );
        }

        window.addEventListener(
          "scroll",
          function () {
            if (isSyncing) return;

            const now = Date.now();

            if (now - lastSent < 80) return;

            lastSent = now;

            window.parent.postMessage(
              {
                __RMS__: true,
                type: "CHILD_SCROLL",
                percent: getScrollPercent()
              },
              "*"
            );
          },
          { passive: true }
        );

        window.addEventListener("message", function (event) {
          const data = event.data || {};

          if (data.__RMS__ === true && data.type === "SCROLL_TO_PERCENT") {
            scrollToPercent(Number(data.percent || 0), Boolean(data.smooth));
          }

          if (data.__RMS__ === true && data.type === "NAVIGATE_TO_URL" && data.url) {
            if (location.href !== data.url) {
              location.href = data.url;
            }
          }
        });

        const originalPushState = history.pushState;
        const originalReplaceState = history.replaceState;

        history.pushState = function () {
          originalPushState.apply(this, arguments);
          setTimeout(notifyNavigation, 50);
        };

        history.replaceState = function () {
          originalReplaceState.apply(this, arguments);
          setTimeout(notifyNavigation, 50);
        };

        window.addEventListener("popstate", function () {
          setTimeout(notifyNavigation, 50);
        });

        document.addEventListener(
          "click",
          function () {
            setTimeout(notifyNavigation, 250);
            setTimeout(notifyNavigation, 700);
          },
          true
        );
      })();
    </script>
  </body>
